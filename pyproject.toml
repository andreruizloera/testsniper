[project]
name = "testsniper"
version = "0.1.0"
description = "Run the tests your code change can actually affect."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andre Ruiz Loera", email = "andre.x.ruizloera@gmail.com" }]
dependencies = []
keywords = ["pytest", "testing", "test-selection", "ci", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/andreruizloera/testsniper"
Issues = "https://github.com/andreruizloera/testsniper/issues"

[project.optional-dependencies]
# The pytest plugin is the only part that needs pytest. The command-line tool
# invokes the target project's pytest as a subprocess and imports nothing.
pytest = ["pytest>=8.0"]

[project.scripts]
testsniper = "testsniper.cli:main"

[project.entry-points.pytest11]
testsniper = "testsniper.plugin"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The example projects are inputs to the tool, not part of it. They are meant
# to read like ordinary user code, including import layouts ruff cannot
# resolve from here (their packages are only importable from their own root).
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET"]
